name: Build Debug APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Check project structure
        run: |
          echo "Current directory:"
          pwd
          echo ""
          echo "Project files:"
          ls -la
          echo ""
          echo "App folder:"
          ls -la app
          echo ""
          echo "Layout files:"
          ls -la app/src/main/res/layout
          echo ""
          echo "Kotlin files:"
          ls -la app/src/main/java/com/example/panchang

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Find generated APK
        run: |
          echo "Generated APK:"
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TeluguPanchangam-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

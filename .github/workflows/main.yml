name: Build Debug APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set Gradle permissions
        run: chmod +x gradlew

      - name: Check project files
        run: |
          echo "Current directory:"
          pwd
          echo ""
          echo "Project files:"
          ls -la
          echo ""
          echo "Checking Android project:"
          ls -la app
          echo ""
          echo "Checking layouts:"
          ls -la app/src/main/res/layout || true
          echo ""
          echo "Checking Kotlin files:"
          ls -la app/src/main/java/com/example/panchang || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          echo "Generated APK files:"
          find app/build/outputs/apk/debug -type f -name "*.apk" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TeluguPanchangam-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
